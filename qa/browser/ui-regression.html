<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Uncluster UI regression checks</title>
  <style>
    body { font-family: system-ui, sans-serif; margin: 1rem; }
    iframe { border: 0; width: 320px; height: 568px; }
    li.pass { color: #087a36; }
    li.fail { color: #b42318; }
  </style>
</head>
<body>
  <h1>Uncluster UI regression checks</h1>
  <ol id="results"></ol>
  <iframe id="app" src="/dist/index.html" title="Uncluster test fixture"></iframe>
  <script>
    const results = document.getElementById('results');
    const frame = document.getElementById('app');

    function record(name, pass, actual) {
      const row = document.createElement('li');
      row.className = pass ? 'pass' : 'fail';
      row.dataset.test = name;
      row.textContent = (pass ? 'PASS' : 'FAIL') + ': ' + name + ' — ' + actual;
      results.appendChild(row);
    }

    frame.addEventListener('load', async () => {
      const win = frame.contentWindow;
      const doc = frame.contentDocument;

      doc.getElementById('mode-scrape-btn').click();
      doc.getElementById('scrape-url-input').value = 'https://example.com';
      doc.querySelector('#scrape-action-btn button').click();
      await new Promise(resolve => setTimeout(resolve, 300));

      const formatStyle = win.getComputedStyle(doc.querySelector('.button.sec'));
      const formatHidden = formatStyle.visibility === 'hidden' ||
        formatStyle.display === 'none' ||
        formatStyle.opacity === '0' ||
        formatStyle.pointerEvents === 'none';
      record(
        'scrape mode does not expose upload-only Format HTML',
        formatHidden,
        'visibility=' + formatStyle.visibility + ', opacity=' + formatStyle.opacity +
          ', pointer-events=' + formatStyle.pointerEvents
      );

      const triggers = [...doc.querySelectorAll('.dropdown-trigger')];
      const keyboardTriggers = triggers.every(trigger =>
        trigger.tagName === 'BUTTON' ||
        (trigger.getAttribute('role') === 'button' && trigger.tabIndex >= 0)
      );
      record(
        'dropdown triggers are keyboard-focusable controls',
        keyboardTriggers,
        triggers.map(trigger => trigger.tagName + ':tabIndex=' + trigger.tabIndex).join(', ')
      );

      const nestedInteractiveCount = doc.querySelectorAll('a.button > button').length;
      record(
        'action controls do not nest buttons inside links',
        nestedInteractiveCount === 0,
        'nested interactive controls=' + nestedInteractiveCount
      );

      win.showToast('Regression message', 'info');
      await new Promise(resolve => setTimeout(resolve, 50));
      const toast = doc.querySelector('.toast');
      const liveToast = toast &&
        (toast.getAttribute('role') === 'status' ||
          toast.getAttribute('role') === 'alert' ||
          toast.hasAttribute('aria-live'));
      record(
        'toast feedback is exposed as a live region',
        Boolean(liveToast),
        toast ? 'role=' + toast.getAttribute('role') +
          ', aria-live=' + toast.getAttribute('aria-live') : 'toast missing'
      );

      const storagePrototype = win.Storage.prototype;
      const originalSetItem = storagePrototype.setItem;
      let themeStorageError = null;
      storagePrototype.setItem = () => {
        throw new win.DOMException('Storage disabled for regression test', 'SecurityError');
      };
      try {
        win.applyTheme('light');
      } catch (error) {
        themeStorageError = error;
      } finally {
        storagePrototype.setItem = originalSetItem;
      }
      record(
        'theme changes survive unavailable localStorage',
        themeStorageError === null && doc.documentElement.dataset.theme === 'light',
        themeStorageError ? themeStorageError.name + ': ' + themeStorageError.message :
          'theme=' + doc.documentElement.dataset.theme
      );

      const originalFetch = win.fetch;
      const originalDownloadBlob = win.downloadBlob;
      let capturedScrapeFilename = null;
      win.fetch = async () => ({
        ok: true,
        blob: async () => new win.Blob(['fixture'], { type: 'application/zip' }),
        headers: { get: () => 'attachment; filename="example-capture.zip"' },
      });
      win.downloadBlob = async (blob, filename) => {
        capturedScrapeFilename = filename;
        return 'downloaded';
      };
      doc.getElementById('download-name-zip').value = '';
      await win.scrapeAndExport('zip');
      win.fetch = originalFetch;
      win.downloadBlob = originalDownloadBlob;
      record(
        'blank scrape download name uses the server filename',
        capturedScrapeFilename === 'example-capture.zip',
        'filename=' + capturedScrapeFilename
      );

      const docsHTML = await fetch('/dist/how-it-works.html').then(response => response.text());
      const docsDocument = new DOMParser().parseFromString(docsHTML, 'text/html');
      const documentedPaths = [...docsDocument.querySelectorAll('.api-table tbody tr td:nth-child(2)')]
        .map(cell => cell.textContent.trim());
      const requiredPaths = [
        '/api/format',
        '/api/convert',
        '/api/analyze',
        '/api/export',
        '/api/export-nodejs',
        '/api/export-nodejs-ejs',
        '/api/bundle-zip',
        '/api/scrape',
        '/api/scrape-nodejs',
        '/api/scrape-nodejs-ejs',
        '/api/health',
      ];
      const docsText = docsDocument.body.textContent;
      const docsCurrent = requiredPaths.every(path => documentedPaths.includes(path)) &&
        docsText.includes('multipart/form-data') &&
        docsText.includes('{ url: string }') &&
        docsText.includes('{ status, service, revision }');
      record(
        'technical API reference matches the registered routes and payloads',
        docsCurrent,
        'documented routes=' + documentedPaths.length + '/' + requiredPaths.length
      );

      record(
        '320px layout has no horizontal overflow',
        doc.documentElement.scrollWidth <= win.innerWidth,
        'scrollWidth=' + doc.documentElement.scrollWidth + ', innerWidth=' + win.innerWidth
      );

      document.body.dataset.complete = 'true';
    });
  </script>
</body>
</html>
